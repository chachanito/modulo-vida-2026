name: Publicar Justificador Vida
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Preparar aplicación estática
        run: |
          mkdir -p _site/public
          cp index.html cruce-datos.html cotizador.html macro-pesados.html cotizador-productos-cerrados.html capturacion_facturacion.html _site/
          cp -R public/js public/css public/images public/data public/templates _site/public/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
